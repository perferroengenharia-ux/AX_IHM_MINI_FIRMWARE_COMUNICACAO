; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; O ESP-IDF gera nomes extensos na API do CMake. Manter o build fora do
; caminho longo do workspace evita Full Clean parcial e codemodel corrompido
; no Windows.
build_dir = ${sysenv.TEMP}/pio-ax-ihm-comunicacao-mqtt

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; Nao permitir que a abertura do terminal use DTR/RTS para manter
; GPIO0/EN no circuito de auto-download.
monitor_dtr = 0
monitor_rts = 0
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
